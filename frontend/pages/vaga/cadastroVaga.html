<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../src/assets/favicon.png" type="image/x-icon">
    <title>Cadastro de Vaga</title>
</head>
<body>
    <main class="p-4 p-lg-5">
        <div class="cabecalho">
            <p class="subtitulo">LINKETINDER</p>
            <h1>Cadastro de vaga</h1>
            <p class="texto-secundario">Cadastre uma nova oportunidade para encontrar candidatos.</p>
        </div>

        <form id="form-vaga" class="formulario">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <label for="titulo" class="form-label">Título da vaga</label>
                    <input type="text" id="titulo" class="form-control" placeholder="Ex.: Desenvolvedor Python" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="empresa" class="form-label">Empresa</label>
                    <input type="text" id="empresa" class="form-control" placeholder="Nome da empresa" required>
                </div>

                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição da vaga</label>
                    <textarea id="descricao" class="form-control" rows="5" placeholder="Descreva as atividades, requisitos e informações da vaga" required></textarea>
                </div>

                <div class="col-12">
                    <label for="competencias" class="form-label">Competências desejadas</label>
                    <input type="text" id="competencias" class="form-control" placeholder="Ex.: Python, Java, SQL" required>
                    <div class="form-text">Separe as competências por vírgula.</div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="reset" class="btn btn-outline-pink">Limpar</button>
                <button type="submit" class="btn btn-pink">Cadastrar vaga</button>
            </div>
        </form>
    </main>

    <script type="module" src="../../dist/scripts/vaga/cadastroVaga.js"></script>
</body>
</html>
