<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../src/assets/favicon.png" type="image/x-icon">
    <title>Perfil do Candidato</title>
</head>
<body>
    <main class="p-4 p-lg-5">
        <div class="cabecalho">
            <p class="subtitulo">LINKETINDER</p>
            <h1>Perfil do candidato</h1>
            <p class="texto-secundario">Confira as informações do seu perfil profissional.</p>
        </div>

        <div id="perfil-candidato" class="card-pessoa">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <p><strong>Nome:</strong> <span id="nome"></span></p>
                    <p><strong>E-mail:</strong> <span id="email"></span></p>
                    <p><strong>CPF:</strong> <span id="cpf"></span></p>
                    <p><strong>Idade:</strong> <span id="idade"></span></p>
                    <p><strong>Estado:</strong> <span id="estado"></span></p>
                </div>

                <div class="col-12 col-md-6">
                    <p><strong>CEP:</strong> <span id="cep"></span></p>
                    <p><strong>Formação:</strong> <span id="formacao"></span></p>
                    <p><strong>Competências:</strong> <span id="competencias"></span></p>
                </div>

                <div class="col-12">
                    <p><strong>Descrição:</strong></p>
                    <p id="descricao"></p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../../dist/scripts/candidato/perfilCandidato.js"></script>
</body>
</html>
