<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../src/assets/favicon.png" type="image/x-icon">
    <title>Cadastro de Candidato</title>
</head>
<body>
    <main class="p-4 p-lg-5">
        <div class="cabecalho">
            <p class="subtitulo">LINKETINDER</p>
            <h1>Cadastro de candidato</h1>
            <p class="texto-secundario">Crie seu perfil para encontrar oportunidades.</p>
        </div>
        <form id="form-candidato" class="formulario">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <label for="nome" class="form-label">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="cpf" class="form-label">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        class="form-control"
                        placeholder="Digite seu CPF"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="idade" class="form-label">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        class="form-control"
                        placeholder="Digite sua idade"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="estado" class="form-label">Estado</label>
                    <input
                        type="text"
                        id="estado"
                        class="form-control"
                        placeholder="Ex.: Santa Catarina"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="cep" class="form-label">CEP</label>
                    <input
                        type="text"
                        id="cep"
                        class="form-control"
                        placeholder="Digite seu CEP"
                        required
                    >
                </div>
                <div class="col-12">
                    <label for="descricao" class="form-label">Sobre você</label>
                    <textarea
                        id="descricao"
                        class="form-control"
                        rows="4"
                        placeholder="Conte um pouco sobre você..."
                        required
                    ></textarea>
                </div>
                <div class="col-12">
                    <label for="competencias" class="form-label">Competências</label>
                    <input
                        type="text"
                        id="competencias"
                        class="form-control"
                        placeholder="Ex.: Python, Java, C"
                        required
                    >
                    <div class="form-text">
                        Separe as competências por vírgula.
                    </div>
                </div>
                <div class="col-12">
                    <label for="formacao" class="form-label">Formação</label>
                    <input
                        type="text"
                        id="formacao"
                        class="form-control"
                        placeholder="Ex.: Engenharia de Computação"
                        required
                    >
                </div>
                <div class="col-12">
                    <div
                        class="
                            d-flex
                            justify-content-end
                            gap-2
                            pt-2
                        "
                    >
                        <button type="reset" class="btn btn-outline-pink">Limpar</button>
                        <button type="submit" class="btn btn-pink">Cadastrar candidato</button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script type="module" src="../../dist/scripts/candidato/cadastroCandidato.js"></script>
</body>
</html>
