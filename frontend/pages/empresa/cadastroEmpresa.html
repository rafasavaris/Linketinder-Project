<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../src/assets/favicon.png" type="image/x-icon">
    <title>Cadastro de Empresa</title>
</head>

<body>
    <main class="p-4 p-lg-5">
        <div class="cabecalho">
            <p class="subtitulo">LINKETINDER</p>
            <h1>Cadastro de empresa</h1>
            <p class="texto-secundario">Crie o perfil da sua empresa para encontrar candidatos.</p>
        </div>
        <form id="form-empresa" class="formulario">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <label for="nome" class="form-label">Nome da empresa</label>
                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Digite o nome da empresa"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="empresa@email.com"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="cnpj" class="form-label">CNPJ</label>
                    <input
                        type="text"
                        id="cnpj"
                        class="form-control"
                        placeholder="00.000.000/0000-00"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="pais" class="form-label">País</label>
                    <input
                        type="text"
                        id="pais"
                        class="form-control"
                        placeholder="Ex.: Brasil"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="estado" class="form-label">Estado</label>
                    <input
                        type="text"
                        id="estado"
                        class="form-control"
                        placeholder="Ex.: Santa Catarina"
                        required
                    >
                </div>
                <div class="col-12 col-md-6">
                    <label for="cep" class="form-label">CEP</label>
                    <input
                        type="text"
                        id="cep"
                        class="form-control"
                        placeholder="00000-000"
                        required
                    >
                </div>
                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição da empresa</label>
                    <textarea
                        id="descricao"
                        class="form-control"
                        rows="4"
                        placeholder="Conte um pouco sobre a empresa"
                        required
                    ></textarea>
                </div>
                <div class="col-12">
                    <label for="competencias" class="form-label">Competências</label>
                    <input
                        type="text"
                        id="competencias"
                        class="form-control"
                        placeholder="Ex.: Python, Java, C"
                        required
                    >
                    <div class="form-text">Separe as competências por vírgula.</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="reset" class="btn btn-outline-pink">Limpar</button>
                <button type="submit" class="btn btn-pink">Cadastrar empresa</button>
            </div>
        </form>
    </main>
    <script type="module" src="../../dist/scripts/empresa/cadastroEmpresa.js"></script>
</body>
</html>
