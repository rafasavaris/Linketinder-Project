<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../src/assets/favicon.png" type="image/x-icon">
    <title>Perfil da Empresa</title>
</head>
<body>
    <main class="p-4 p-lg-5">
        <div class="cabecalho">
            <p class="subtitulo">LINKETINDER</p>
            <h1>Perfil da empresa</h1>
            <p class="texto-secundario">Confira as informações da empresa e o perfil dos candidatos.</p>
        </div>

        <div id="perfil-empresa" class="card-pessoa">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <p><strong>Nome:</strong> <span id="nome"></span></p>
                    <p><strong>E-mail:</strong> <span id="email"></span></p>
                    <p><strong>CNPJ:</strong> <span id="cnpj"></span></p>
                    <p><strong>País:</strong> <span id="pais"></span></p>
                </div>

                <div class="col-12 col-md-6">
                    <p><strong>Estado:</strong> <span id="estado"></span></p>
                    <p><strong>CEP:</strong> <span id="cep"></span></p>
                    <p><strong>Competências:</strong> <span id="competencias"></span></p>
                </div>

                <div class="col-12">
                    <p><strong>Descrição:</strong></p>
                    <p id="descricao"></p>
                </div>
            </div>
        </div>

        <div class="grafico-container">
            <h2>Competências dos candidatos</h2>
            <p class="texto-secundario">Quantidade de candidatos por competência.</p>
            <div class="table-responsive">
                <canvas id="grafico-competencias" width="600" height="400"></canvas>
            </div>
        </div>
    </main>

    <script type="module" src="../../dist/scripts/empresa/perfilEmpresa.js"></script>
</body>
</html>
